[project]
name = "company-brain-server"
version = "0.1.0"
description = "MCP server for the Company Brain plugin."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "numpy>=2.0",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["company_brain"]

[dependency-groups]
dev = ["pytest>=8"]
